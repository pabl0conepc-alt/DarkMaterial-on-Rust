# DarkMaterial lock screen — hyprlock recreation of DankMaterialShell's lock:
# huge clock (hours on-surface, minutes in primary), date, avatar + password
# pill, media and battery/status line, power buttons hint.
# Generated from templates/hyprlock.conf by `dmr` on every theme change.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint:enabled = true
}

animations {
    enabled = true
    bezier = std, 0.2, 0, 0, 1
    animation = fadeIn, 1, 4, std
    animation = fadeOut, 1, 3, std
    animation = inputFieldDots, 1, 2, std
}

background {
    monitor =
    path = {{ wallpaper }}
    blur_passes = 3
    blur_size = 10
    brightness = 0.45
    color = rgb({{ surface.hex }})
}

# ---------------------------------------------------------------- clock
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='#{{ onSurface.hex }}'>$(date +%H):</span><span foreground='#{{ primary.hex }}'>$(date +%M)</span>"
    font_size = 118
    font_family = Google Sans Flex Black
    position = 0, -60
    halign = center
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgb({{ onSurfaceVariant.hex }})
    font_size = 20
    font_family = Google Sans Flex Medium
    position = 0, -250
    halign = center
    valign = top
    zindex = 1
}

# ---------------------------------------------------------------- avatar + password
shape {
    monitor =
    size = 56, 56
    color = rgb({{ surfaceContainerHigh.hex }})
    rounding = -1
    position = -190, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span font_desc="Material Symbols Rounded">person</span>
    color = rgb({{ onSurface.hex }})
    font_size = 24
    position = -190, 0
    halign = center
    valign = center
    zindex = 2
}

image {
    monitor =
    path = {{ face }}
    size = 56
    rounding = -1
    border_size = 0
    position = -190, 0
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 312, 56
    outline_thickness = 0
    rounding = -1
    inner_color = rgb({{ surfaceContainerHigh.hex }})
    font_color = rgb({{ onSurface.hex }})
    check_color = rgb({{ primary.hex }})
    fail_color = rgb({{ error.hex }})
    capslock_color = rgb({{ tertiary.hex }})
    font_family = Google Sans Flex
    placeholder_text = <span foreground="##{{ onSurfaceVariant.hex }}">Password</span>
    fail_text = <span foreground="##{{ error.hex }}">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    position = 34, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span font_desc="Material Symbols Rounded">lock</span>
    color = rgb({{ primary.hex }})
    font_size = 16
    position = -100, 0
    halign = center
    valign = center
    zindex = 2
}

# ---------------------------------------------------------------- status
label {
    monitor =
    text = cmd[update:2000] dmr lockinfo media-title
    color = rgb({{ onSurface.hex }})
    font_size = 13
    font_family = Google Sans Flex Medium
    position = 0, 88
    halign = center
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:2000] dmr lockinfo media-artist
    color = rgb({{ onSurfaceVariant.hex }})
    font_size = 12
    font_family = Google Sans Flex
    position = 0, 64
    halign = center
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = <span font_desc="Material Symbols Rounded">notifications</span>  <span font_desc="Google Sans Flex">Notifications</span>
    color = rgb({{ onSurface.hex }})
    font_size = 13
    position = 0, -88
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:30000] echo "$(dmr lockinfo weather-big)"
    color = rgb({{ onSurface.hex }})
    font_size = 14
    font_family = Google Sans Flex Medium
    position = -24, -20
    halign = right
    valign = top
    zindex = 1
}
