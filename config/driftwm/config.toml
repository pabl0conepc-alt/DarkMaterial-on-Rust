# driftwm config for DarkMaterial (DMS-style shell on driftwm).
# Keybindings follow DMS's dots (hypr/variables.lua) wherever driftwm has
# an equivalent. driftwm "bookmarks" play the role of Hyprland workspaces.
#
# The two "dmr" blocks are rewritten by `dmr` on every theme/wallpaper
# change (colours + wallpaper). Edit anything outside them freely.

mod_key = "super"
focus_follows_mouse = false
window_placement = "auto"

# The shell itself (bar, panels, notifications, OSD…) + idle/lock + clipboard.
autostart = [
  "dmr daemon",
  "swayidle -w timeout 300 'dmr lock' before-sleep 'dmr lock' lock 'dmr lock'",
  "wl-paste --watch cliphist store",
]

[session]
restore_windows = true
restore_camera = true

[env]
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
QT_QPA_PLATFORMTHEME = "gtk3"
XCURSOR_SIZE = "24"

[input.keyboard]
# layout: `dmr setup` writes your system layout here (never forced to "us")
repeat_rate = 25
repeat_delay = 250
num_lock = true

[input.trackpad]
tap_to_click = true
natural_scroll = true

[navigation]
drift = 0.5
camera_speed = 0.3

[navigation.bookmarks]
# DMS shows 5 workspaces; these are 5 canvas spots.
"1" = [0, 0]
"2" = [3000, 0]
"3" = [6000, 0]
"4" = [9000, 0]
"5" = [12000, 0]

[snap]
gap = 10.0          # DMS gaps (hyprland general:gaps_in*2)
outer_gap = 20.0

[decorations]
default_mode = "minimal"
corner_radius = 10
shadow = true
border_width = 2
title_bar_height = 25
font = "Rubik"
# >>> dmr managed (do not edit inside) >>>
bg_color = "#261d20"
fg_color = "#efdfe2"
border_color = "#514347"
border_color_focused = "#ffb0ca"
# <<< dmr managed <<<

[effects]
blur_radius = 3
blur_strength = 2.0
animation_speed = 0.35
animation_scale = 0.9

[background]
# >>> dmr wallpaper >>>
type = "default"
# <<< dmr wallpaper <<<

[keybindings]
# DankMaterialShell default keybinds (its niri template), mapped to dmr.
"mod+space" = "spawn dmr toggle launcher"
"mod+v" = "spawn dmr-clipboard"
"mod+m" = "spawn dmr toggle dash media"
"mod+d" = "spawn dmr toggle dash overview"
"mod+y" = "spawn dmr toggle dash wallpaper"
"mod+a" = "spawn dmr toggle controlcenter"
"mod+x" = "spawn dmr toggle powermenu"
"mod+ctrl+n" = "spawn dmr toggle notifcenter"
"mod+comma" = "spawn dmr settings"
"mod+alt+l" = "spawn dmr lock"
"mod+alt+n" = "spawn dmr night"
"mod+alt+i" = "spawn dmr idle-inhibit"
"mod+shift+c" = "spawn hyprpicker -a"
"mod+period" = "spawn dmr-emoji"
"ctrl+alt+delete" = "spawn dmr toggle powermenu"
"ctrl+alt+c" = "spawn dmr notifs clear"
"ctrl+mod+shift+r" = "spawn dmr quit"
"ctrl+mod+alt+r" = "spawn sh -c 'dmr quit; sleep 0.5; dmr daemon'"

"mod+t" = "exec foot"
"mod+return" = "exec foot"
"mod+e" = "exec thunar"
"mod+q" = "close-window"
"mod+f" = "toggle-fullscreen"
"mod+shift+e" = "quit"

# Bookmarks are the bar's workspaces.
"mod+1" = "go-to-bookmark 1"
"mod+2" = "go-to-bookmark 2"
"mod+3" = "go-to-bookmark 3"
"mod+4" = "go-to-bookmark 4"
"mod+5" = "go-to-bookmark 5"
"mod+alt+1" = "move-to-bookmark 1"
"mod+alt+2" = "move-to-bookmark 2"
"mod+alt+3" = "move-to-bookmark 3"
"mod+alt+4" = "move-to-bookmark 4"
"mod+alt+5" = "move-to-bookmark 5"
"mod+shift+1" = "set-bookmark 1"
"mod+shift+2" = "set-bookmark 2"
"mod+shift+3" = "set-bookmark 3"
"mod+shift+4" = "set-bookmark 4"
"mod+shift+5" = "set-bookmark 5"
"mod+page_down" = "spawn dmr ws-scroll down"
"mod+page_up" = "spawn dmr ws-scroll up"

# driftwm canvas actions that DMS binds would shadow, moved aside.
"mod+h" = "home-toggle"
"mod+o" = "zoom-to-fit"
"mod+p" = "toggle-pin-to-screen"
"mod+c" = "center-window"
"alt+tab" = "cycle-windows forward"
"alt+shift+tab" = "cycle-windows backward"

"Print" = "spawn dmr screenshot region"
"ctrl+Print" = "spawn dmr screenshot full"

"XF86AudioRaiseVolume" = "spawn dmr volume up"
"XF86AudioLowerVolume" = "spawn dmr volume down"
"XF86AudioMute" = "spawn dmr volume mute"
"XF86AudioMicMute" = "spawn dmr mic mute"
"XF86MonBrightnessUp" = "spawn dmr brightness up"
"XF86MonBrightnessDown" = "spawn dmr brightness down"
"XF86AudioPlay" = "spawn dmr media play-pause"
"XF86AudioPause" = "spawn dmr media play-pause"
"XF86AudioNext" = "spawn dmr media next"
"XF86AudioPrev" = "spawn dmr media previous"
"XF86AudioStop" = "spawn dmr media stop"
